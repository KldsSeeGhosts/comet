name: Noches releases

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/*release*'
      - 'scripts/package-*.sh'
      - 'scripts/build-chromium.sh'
      - 'scripts/install-linux.sh'
      - 'crates/update/**'
      - 'crates/chromium/**'
      - 'dist/browser/**'
      - 'dist/macos/**'
      - 'vendor/gpui_linux/**'
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize published channels; obsolete PR builds can be cancelled safely.
concurrency:
  group: noches-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    if: github.repository_owner == 'KldsSeeGhosts' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: identity
        env:
          NOCHES_SOURCE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python3 scripts/noches-release.py prepare
      - name: Release configuration tests
        run: python3 scripts/test-noches-release.py

  linux:
    if: github.event_name != 'pull_request'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake ninja-build libnss3 libatk-bridge2.0-0 libgtk-3-0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Application and updater tests
        run: cargo test --locked -p zeron-update -p zeron
      - name: Linux input-seat tests
        run: cargo test --locked -p gpui_linux --lib
      - name: UI regression tests
        run: cargo test --release --locked -p zeron-ui --lib -- --test-threads=1
      - name: Package
        env:
          NOCHES_CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOCHES_VERSION: ${{ needs.prepare.outputs.version }}
          NOCHES_REPOSITORY: ${{ github.repository }}
          NOCHES_COMMIT: ${{ github.sha }}
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/noches-*.tar.gz
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Application and updater tests
        run: cargo test --locked -p zeron-update -p zeron
      - name: Chromium build dependencies
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: Package macOS application
        env:
          NOCHES_CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOCHES_VERSION: ${{ needs.prepare.outputs.version }}
          NOCHES_REPOSITORY: ${{ github.repository }}
          NOCHES_COMMIT: ${{ github.sha }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/noches-*.dmg
            target/package/noches-*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [prepare, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NOCHES_CHANNEL: ${{ needs.prepare.outputs.channel }}
      NOCHES_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish version and channel manifest
        run: python3 scripts/noches-release.py publish
