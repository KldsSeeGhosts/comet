name: Cua installer tests
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cua-installer-tests.yml'
      - 'scripts/cua/test_native_patches.py'
      - 'scripts/cua/build_native.sh'
      - 'scripts/cua/native/apply_cua.py'
      - 'scripts/cua/native/cua/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cua-installer-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: trycua/cua
          ref: 4af83697b8425944d668c543851ef6ae3639a130
          path: .native/cua
          sparse-checkout: libs/cua-driver/rust
          persist-credentials: false
      - name: Test source preservation and rollback
        env:
          CUA_PATCH_TEST_SOURCE: ${{ github.workspace }}/.native/cua
        run: |
          set -euo pipefail
          mkdir -p .evidence
          python3 -m unittest discover -s scripts/cua -p test_native_patches.py -v 2>&1 | tee .evidence/installer-tests.log
          bash -n scripts/cua/build_native.sh
          bash scripts/cua/build_native.sh --help
          python3 -m py_compile scripts/cua/native/apply_cua.py scripts/cua/native/vendor_zui.py
          tar --exclude=__pycache__ -czf .evidence/native-patch-kit.tar.gz scripts/cua/native scripts/cua/test_native_patches.py scripts/cua/build_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-installer-evidence
          path: .evidence
          retention-days: 7
