name: Cua installer tests
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cua-installer-tests.yml'
      - 'scripts/cua/test_native_patches.py'
      - 'scripts/cua/test_hyprland_runtime_patch.py'
      - 'scripts/cua/test_native_installers.py'
      - 'scripts/cua/build_native.sh'
      - 'scripts/cua/native/**'
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/cua-installer-tests.yml'
      - 'scripts/cua/test_native_patches.py'
      - 'scripts/cua/test_hyprland_runtime_patch.py'
      - 'scripts/cua/test_native_installers.py'
      - 'scripts/cua/build_native.sh'
      - 'scripts/cua/native/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cua-installer-tests-${{ github.ref }}
  cancel-in-progress: true
env:
  CUA_LEGACY_REV: 4af83697b8425944d668c543851ef6ae3639a130
  CUA_INTEGRATED_REV: a84d5a415edbba7781d97a2c6ae8ce22e8535f65
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the legacy Cua baseline
        uses: actions/checkout@v4
        with:
          repository: trycua/cua
          ref: 4af83697b8425944d668c543851ef6ae3639a130
          path: .native/cua-legacy
          sparse-checkout: libs/cua-driver/rust
          persist-credentials: false
      - name: Check out the integrated Cua repair
        uses: actions/checkout@v4
        with:
          repository: KldsSeeGhosts/cua
          ref: ${{ env.CUA_INTEGRATED_REV }}
          path: .native/cua-integrated
          sparse-checkout: libs/cua-driver/rust
          ssh-key: ${{ secrets.CUA_INSTALLER_READ_KEY }}
          persist-credentials: false
      - name: Test installer sources against the legacy baseline
        env:
          CUA_PATCH_TEST_SOURCE: ${{ github.workspace }}/.native/cua-legacy
          CUA_PATCH_TEST_LEGACY: 4af83697b8425944d668c543851ef6ae3639a130
          CUA_PATCH_TEST_INTEGRATED: ${{ env.CUA_INTEGRATED_REV }}
        run: |
          set -euo pipefail
          mkdir -p installer-evidence
          python3 -m unittest discover -s scripts/cua -p test_native_patches.py -v 2>&1 | tee installer-evidence/native-patches-legacy.log
          python3 -m unittest discover -s scripts/cua -p test_hyprland_runtime_patch.py -v 2>&1 | tee installer-evidence/hyprland-runtime-legacy.log
          python3 -m unittest discover -s scripts/cua -p test_native_installers.py -v 2>&1 | tee installer-evidence/native-installers-legacy.log
      - name: Test installer sources against the integrated checkout
        env:
          CUA_PATCH_TEST_SOURCE: ${{ github.workspace }}/.native/cua-integrated
          CUA_PATCH_TEST_LEGACY: 4af83697b8425944d668c543851ef6ae3639a130
          CUA_PATCH_TEST_INTEGRATED: ${{ env.CUA_INTEGRATED_REV }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/cua -p test_native_patches.py -v 2>&1 | tee installer-evidence/native-patches-integrated.log
          python3 -m unittest discover -s scripts/cua -p test_hyprland_runtime_patch.py -v 2>&1 | tee installer-evidence/hyprland-runtime-integrated.log
          python3 -m unittest discover -s scripts/cua -p test_native_installers.py -v 2>&1 | tee installer-evidence/native-installers-integrated.log
      - name: Check scripts and bundle the patch kit
        run: |
          set -euo pipefail
          bash -n scripts/cua/build_native.sh
          bash scripts/cua/build_native.sh --help
          python3 -m py_compile scripts/cua/native/*.py \
            scripts/cua/test_native_patches.py \
            scripts/cua/test_hyprland_runtime_patch.py \
            scripts/cua/test_native_installers.py
          tar --exclude=__pycache__ -czf installer-evidence/native-patch-kit.tar.gz \
            scripts/cua/native \
            scripts/cua/test_native_patches.py \
            scripts/cua/test_hyprland_runtime_patch.py \
            scripts/cua/test_native_installers.py \
            scripts/cua/build_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-installer-evidence
          path: installer-evidence
          if-no-files-found: error
          retention-days: 7
