name: Noches split-pane repair
on:
  push:
    branches: [fix/pane-owned-chat-surfaces]
    paths: [.github/workflows/noches-split-pane-repair.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'KldsSeeGhosts/comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f29cf9e3c60226d9758bcee0a26e8e0b40d5a996
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-patch-transport
          path: .github/workflows/noches-split-pane-repair.yml
          include-hidden-files: true
          retention-days: 1
