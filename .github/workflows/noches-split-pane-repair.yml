name: Noches split-pane repair
on:
  push:
    branches: [fix/pane-owned-chat-surfaces]
    paths: [.github/workflows/noches-split-pane-repair.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'KldsSeeGhosts/comet' && github.ref == 'refs/heads/fix/pane-owned-chat-surfaces'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply reviewed recovery fix and regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6db5d7912ab4fe8f0691de8e1936eb02d2002440
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('crates/ui/src/composer.rs')
          s = p.read_text()
          start = s.index('                    // A pane-fixed composer returns to its own new-chat')
          end = s.index('                    composer.state.update(cx, |s, cx| {', start)
          s = s[:start] + '''                    composer.restore_failed_send_input(
                                  &err_chat_id, is_new, restore_text, cx,
                              );
          '''.replace('                                  ', '                        ').replace('                              ', '                    ') + s[end:]
          start = s.index('                    if is_new && composer.current_key != restore_key {')
          end = s.index('                    if !ordinary_staged.is_empty() {', start)
          s = s[:start] + s[end:]
          anchor = "    /// The space the target's canvas/git decisions resolve against:"
          assert s.count(anchor) == 1
          helper = '''    /// Recover a failed prompt without changing a newer pane navigation.
              pub(crate) fn restore_failed_send_input(
                  &mut self,
                  failed_chat_id: &str,
                  is_new: bool,
                  text: String,
                  cx: &mut Context<Self>,
              ) {
                  let restore_key = if is_new { "" } else { failed_chat_id };
                  if is_new && self.target.chat_id(self.state.read(cx)) == Some(failed_chat_id) {
                      self.reset_fixed_target(cx);
                  }
                  if self.current_key == restore_key {
                      self.input.update(cx, |input, cx| input.set_text(text, cx));
                  } else {
                      self.drafts.insert(restore_key.to_string(), text);
                  }
              }

          '''
          s = s.replace(anchor, helper + anchor)
          assert hashlib.sha256(s.encode()).hexdigest() == '1a875ab9b3938626101764e4845d5c7747a2a44cbfe7155117383706d33e6f47'
          p.write_text(s)
          p = Path('crates/ui/src/shell/pane_surface_regressions.rs')
          p.write_text(p.read_text() + '''
          #[gpui::test]
          fn a_late_first_send_failure_preserves_the_new_session_and_draft(cx: &mut TestAppContext) {
              let dir = tempfile::tempdir().unwrap();
              cx.update(|cx| init_app(dir.path(), cx));
              let window = cx.add_window(|_, cx| new_shell(dir.path(), cx));
              window.update(cx, |shell, _, cx| {
                  prepare_selected_composer(shell, cx);
                  shell.split_workspace_view(Direction::Right, cx);
                  let pane = shell.workspace.focused_pane().unwrap();
                  let composer = shell.active_composer();
                  composer.update(cx, |composer, cx| composer.bind_chat("failed-mint".into(), cx));
                  shell.ensure_pane_chat_surfaces(cx);
                  shell.open_chat("chat-b".into(), cx);
                  shell.on_state_changed(&shell.state.clone(), cx);
                  draft(&composer, "newer session draft", cx);
                  composer.update(cx, |composer, cx| {
                      composer.restore_failed_send_input("failed-mint", true, "recover first prompt".into(), cx);
                  });
                  shell.ensure_pane_chat_surfaces(cx);
                  assert_eq!(shell.workspace.layout.pane(pane).unwrap().session_id.as_deref(), Some("chat-b"));
                  assert_eq!(composer.read(cx).current_key, "chat-b");
                  assert_eq!(draft_text(&composer, cx), "newer session draft");
                  shell.open_new_session(cx);
                  shell.on_state_changed(&shell.state.clone(), cx);
                  assert_eq!(draft_text(&composer, cx), "recover first prompt");
              }).unwrap();
          }

          #[gpui::test]
          fn a_late_existing_send_failure_restores_only_its_own_draft(cx: &mut TestAppContext) {
              let dir = tempfile::tempdir().unwrap();
              cx.update(|cx| init_app(dir.path(), cx));
              let window = cx.add_window(|_, cx| new_shell(dir.path(), cx));
              window.update(cx, |shell, _, cx| {
                  prepare_selected_composer(shell, cx);
                  shell.split_workspace_view(Direction::Right, cx);
                  let composer = shell.active_composer();
                  shell.open_chat("chat-b".into(), cx);
                  shell.on_state_changed(&shell.state.clone(), cx);
                  shell.open_new_session(cx);
                  shell.on_state_changed(&shell.state.clone(), cx);
                  draft(&composer, "newer canvas draft", cx);
                  composer.update(cx, |composer, cx| {
                      composer.restore_failed_send_input("chat-b", false, "recover existing prompt".into(), cx);
                  });
                  shell.ensure_pane_chat_surfaces(cx);
                  assert_eq!(composer.read(cx).current_key, "");
                  assert_eq!(draft_text(&composer, cx), "newer canvas draft");
                  shell.open_chat("chat-b".into(), cx);
                  shell.on_state_changed(&shell.state.clone(), cx);
                  assert_eq!(draft_text(&composer, cx), "recover existing prompt");
              }).unwrap();
          }
          ''')
          PY
          git diff --check
          rustfmt --edition 2024 --emit stdout crates/ui/src/composer.rs crates/ui/src/shell.rs > /dev/null
          git config user.name 'Noches review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ui/src/composer.rs crates/ui/src/shell/pane_surface_regressions.rs
          git commit -m 'fix: recover failed sends without overwriting a newer pane draft'
          git push origin HEAD:refs/heads/fix/pane-owned-chat-surfaces
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
