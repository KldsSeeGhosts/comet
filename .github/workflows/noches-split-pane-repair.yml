name: Noches split-pane repair

on:
  push:
    branches: [fix/pane-owned-chat-surfaces]
    paths: [.github/workflows/noches-split-pane-repair.yml]

permissions:
  contents: read

jobs:
  publish-reviewed-patches:
    if: github.repository == 'KldsSeeGhosts/comet' && github.ref == 'refs/heads/fix/pane-owned-chat-surfaces'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed patches and publish fast-forward commits
        shell: bash
        env:
          REVIEW_HEAD: ${{ github.sha }}
          PATCH5: 
          PATCH6: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          expected = {5: '74172e504608fcab98703e719be202a162b931712f7312b22908dbbf8851fe29', 6: '524364a70d6c2c220e014bddd53f3a4082cf53a9e06b8d10bd236c07b3a956f7'}
          for number, digest in expected.items():
              data = gzip.decompress(base64.b64decode(os.environ[f'PATCH{number}'], validate=True))
              assert hashlib.sha256(data).hexdigest() == digest, 'Reviewed patch checksum mismatch'
              Path(os.environ['RUNNER_TEMP'], f'pr{number}.patch').write_bytes(data)
          PY
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          test "$(git rev-parse origin/feat/split-pane-workspace)" = 3876e816df6fd6e3a052e97d7960f884cee1a483
          git diff --exit-code 49ef4727d4b4cbbaf943d7ef4c8854b6aef48fe3 "$REVIEW_HEAD" -- crates Cargo.toml Cargo.lock rust-toolchain.toml
          git config user.name 'Noches review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach 3876e816df6fd6e3a052e97d7960f884cee1a483
          git apply --check "$RUNNER_TEMP/pr5.patch"
          git apply "$RUNNER_TEMP/pr5.patch"
          git add crates
          git diff --cached --check
          rustfmt --edition 2024 --emit stdout crates/ui/src/shell.rs > /dev/null
          git commit -m 'fix: preserve workspace selection and consume explicit pane navigation'
          base_fix=$(git rev-parse HEAD)
          git switch --detach "$REVIEW_HEAD"
          git apply --check "$RUNNER_TEMP/pr6.patch"
          git apply "$RUNNER_TEMP/pr6.patch"
          git add crates
          git diff --cached --check
          rustfmt --edition 2024 --emit stdout crates/ui/src/shell.rs crates/ui/src/composer.rs crates/ui/src/pickers.rs > /dev/null
          # The reviewed #6 patch includes every #5 fix and its shared tests.
          # Record their integration as a normal merge, preserving both heads.
          tree=$(git write-tree)
          merged=$(printf '%s\n' 'fix: integrate workspace repairs and preserve pane composer lifetimes' | git commit-tree "$tree" -p "$REVIEW_HEAD" -p "$base_fix")
          git push --atomic origin "$base_fix:refs/heads/feat/split-pane-workspace" "$merged:refs/heads/fix/pane-owned-chat-surfaces"
          printf 'PR5=%s\nPR6=%s\n' "$base_fix" "$merged" | tee -a "$GITHUB_STEP_SUMMARY"
