name: Noches split-pane repair
on:
  push:
    branches: [fix/pane-owned-chat-surfaces]
    paths: [.github/workflows/noches-split-pane-repair.yml]
permissions:
  contents: read
jobs:
  publish-reviewed-patches:
    if: github.repository == 'KldsSeeGhosts/comet' && github.ref == 'refs/heads/fix/pane-owned-chat-surfaces'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore checksum-verified review patches
        shell: bash
        run: |
          set -euo pipefail
          git show f29cf9e3c60226d9758bcee0a26e8e0b40d5a996:.github/workflows/noches-split-pane-repair.yml > "$RUNNER_TEMP/transport.yml"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          transport = (root / 'transport.yml').read_text()
          edits = {
              5: [[1814,1815,''],[2161,2162,''],[3166,3167,'9']],
              6: [[355,355,'ErJ'],[363,363,'UQi6XMRtN5kIswC2a5ULfB8lwsoiQfpcmIiKk8iuOSFhG4msBM+ljvaihu59F0Lj5KuVS6W6Nlll5n'],[417,417,'T8ZIw'],[514,515,''],[546,547,''],[990,991,''],[2217,2219,'R'],[6746,6747,''],[9272,9273,''],[9717,9718,'q']],
          }
          expected = {5:'74172e504608fcab98703e719be202a162b931712f7312b22908dbbf8851fe29',6:'524364a70d6c2c220e014bddd53f3a4082cf53a9e06b8d10bd236c07b3a956f7'}
          for number, corrections in edits.items():
              value = re.search(rf'^          PATCH{number}: (\S+)$', transport, re.M).group(1)
              for start, end, replacement in reversed(corrections):
                  value = value[:start] + replacement + value[end:]
              data = gzip.decompress(base64.b64decode(value, validate=True))
              assert hashlib.sha256(data).hexdigest() == expected[number], 'Reviewed patch checksum mismatch'
              (root / f'pr{number}.patch').write_bytes(data)
          PY
          cat > "$RUNNER_TEMP/followup.patch" <<'PATCH'
          diff --git a/crates/ui/src/shell/pane_surface_regressions.rs b/crates/ui/src/shell/pane_surface_regressions.rs
          index 47dc2e9..fc55c1f 100644
          --- a/crates/ui/src/shell/pane_surface_regressions.rs
          +++ b/crates/ui/src/shell/pane_surface_regressions.rs
          @@ -171,3 +171,39 @@ fn explicit_navigation_is_not_overwritten_by_an_older_composer_binding(
                   assert_eq!(composer.read(cx).current_key, "chat-b");
               }).unwrap();
           }
          +
          +#[gpui::test]
          +fn a_late_queue_acknowledgement_does_not_reopen_the_previous_session(cx: &mut TestAppContext) {
          +    let dir = tempfile::tempdir().unwrap();
          +    cx.update(|cx| init_app(dir.path(), cx));
          +    let window = cx.add_window(|_, cx| new_shell(dir.path(), cx));
          +    window.update(cx, |shell, _, cx| {
          +        prepare_selected_composer(shell, cx);
          +        shell.split_workspace_view(Direction::Right, cx);
          +        let pane = shell.workspace.focused_pane().unwrap();
          +        shell.open_chat("chat-b".into(), cx);
          +        shell.on_state_changed(&shell.state.clone(), cx);
          +        shell.on_pane_composer_event(pane, &ComposerEvent::Queued {
          +            chat_id: "older-mint".into(),
          +            message_id: "old-message".into(),
          +        }, cx);
          +        assert_eq!(shell.workspace.layout.pane(pane).unwrap().session_id.as_deref(), Some("chat-b"));
          +        assert_eq!(shell.workspace.chat_surfaces[&pane].chat_id.as_deref(), Some("chat-b"));
          +    }).unwrap();
          +}
          +
          +#[gpui::test]
          +fn only_the_latest_focus_request_survives_before_paint(cx: &mut TestAppContext) {
          +    let dir = tempfile::tempdir().unwrap();
          +    cx.update(|cx| init_app(dir.path(), cx));
          +    let window = cx.add_window(|_, cx| new_shell(dir.path(), cx));
          +    window.update(cx, |shell, _, cx| {
          +        prepare_selected_composer(shell, cx);
          +        let first = shell.workspace.focused_pane().unwrap();
          +        shell.split_workspace_view(Direction::Right, cx);
          +        let second = shell.workspace.focused_pane().unwrap();
          +        shell.focus_workspace_pane(first, cx);
          +        assert!(shell.workspace.chat_surfaces[&first].composer.read(cx).focus_pending);
          +        assert!(!shell.workspace.chat_surfaces[&second].composer.read(cx).focus_pending);
          +    }).unwrap();
          +}
          diff --git a/crates/ui/src/shell/panes.rs b/crates/ui/src/shell/panes.rs
          index 53b78ea..20554d8 100644
          --- a/crates/ui/src/shell/panes.rs
          +++ b/crates/ui/src/shell/panes.rs
          @@ -198,12 +198,23 @@ impl Shell {
               /// pane composers never drive the global dock transition — `Sent` /
               /// `Queued` bind the layout pane to the minted chat and hand the
               /// own-turn marker to THAT pane's transcript.
          -    fn on_pane_composer_event(
          +    pub(super) fn on_pane_composer_event(
                   &mut self,
                   pane: PaneId,
                   event: &ComposerEvent,
                   cx: &mut Context<Self>,
               ) {
          +        if let ComposerEvent::Sent { chat_id, .. } | ComposerEvent::Queued { chat_id, .. } = event {
          +            // A queue acknowledgement can arrive after this same composer
          +            // navigated elsewhere. Do not rebind the pane to the old send.
          +            let bound = self.workspace.layout.pane(pane)
          +                .is_some_and(|state| state.session_id.as_deref() == Some(chat_id.as_str()));
          +            let current = self.workspace.chat_surfaces.get(&pane)
          +                .is_some_and(|surface| surface.chat_id.as_deref() == Some(chat_id.as_str()));
          +            if !bound || !current {
          +                return;
          +            }
          +        }
                   match event {
                       ComposerEvent::NewThreadTransitionStarted => {
                           // Route observation drives the global dock once selection
          @@ -1192,6 +1203,10 @@ impl Shell {
               /// pane via [`Self::sync_workspace_selection`]. Every mutation path
               /// funnels here, which is also where the WS5 save arms.
               fn retarget_to_focused_pane(&mut self, cx: &mut Context<Self>) {
          +        // Adopt the original input before selecting the newly split canvas.
          +        if self.workspace_mode() {
          +            self.ensure_pane_chat_surfaces(cx);
          +        }
                   self.sync_selection_to_focused_pane(cx);
                   // Keyboard focus follows the focused pane's own composer; a no-op
                   // while an input the user chose keeps focus.
          diff --git a/crates/ui/src/shell/tabs.rs b/crates/ui/src/shell/tabs.rs
          index 400053e..548503c 100644
          --- a/crates/ui/src/shell/tabs.rs
          +++ b/crates/ui/src/shell/tabs.rs
          @@ -61,6 +61,12 @@ impl Shell {
               pub(super) fn focus_composer(&mut self, cx: &mut Context<Self>) {
                   if self.workspace_mode() {
                       self.ensure_pane_chat_surfaces(cx);
          +            let focused = self.workspace.focused_pane();
          +            for (pane, surface) in &self.workspace.chat_surfaces {
          +                if Some(*pane) != focused {
          +                    surface.composer.update(cx, |composer, _| composer.focus_pending = false);
          +                }
          +            }
                   }
                   let composer = self.active_composer();
                   composer.update(cx, |composer, cx| {
          PATCH
          echo '6ac354b3c597e9b6a379a382db77e6aedafb3a4ab55920dba06f3e570cc651e5  followup.patch' | (cd "$RUNNER_TEMP" && sha256sum -c -)
      - name: Publish both reviewed branch commits without merging either PR
        shell: bash
        env:
          REVIEW_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          test "$(git rev-parse origin/feat/split-pane-workspace)" = 3876e816df6fd6e3a052e97d7960f884cee1a483
          git diff --exit-code 49ef4727d4b4cbbaf943d7ef4c8854b6aef48fe3 "$REVIEW_HEAD" -- crates Cargo.toml Cargo.lock rust-toolchain.toml
          git config user.name 'Noches review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach 3876e816df6fd6e3a052e97d7960f884cee1a483
          git apply --check "$RUNNER_TEMP/pr5.patch"
          git apply "$RUNNER_TEMP/pr5.patch"
          git add crates
          git diff --cached --check
          rustfmt --edition 2024 --emit stdout crates/ui/src/shell.rs > /dev/null
          git commit -m 'fix: preserve workspace selection and consume explicit pane navigation'
          base_fix=$(git rev-parse HEAD)
          git switch --detach "$REVIEW_HEAD"
          git apply --check "$RUNNER_TEMP/pr6.patch"
          git apply "$RUNNER_TEMP/pr6.patch"
          git apply --check "$RUNNER_TEMP/followup.patch"
          git apply "$RUNNER_TEMP/followup.patch"
          git add crates
          git diff --cached --check
          rustfmt --edition 2024 --emit stdout crates/ui/src/shell.rs crates/ui/src/composer.rs crates/ui/src/pickers.rs > /dev/null
          # This reviewed tree includes every foundation fix and shared test.
          # Preserve both branch histories with an ordinary two-parent commit.
          tree=$(git write-tree)
          merged=$(printf '%s\n' 'fix: integrate workspace repairs and preserve pane composer lifetimes' | git commit-tree "$tree" -p "$REVIEW_HEAD" -p "$base_fix")
          git push --atomic origin "$base_fix:refs/heads/feat/split-pane-workspace" "$merged:refs/heads/fix/pane-owned-chat-surfaces"
          printf 'PR5=%s\nPR6=%s\n' "$base_fix" "$merged" | tee -a "$GITHUB_STEP_SUMMARY"
