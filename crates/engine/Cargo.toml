[package]
name = "zeron-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Dev variant: engine-side paths/identity that must differ from production
# (propagated from apps/zeron's `dev` via zeron-ui).
dev = ["zeron-harness/dev"]

[dependencies]
zeron-preview.workspace = true
zeron-proto.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
zeron-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true
# tempfile is a runtime dep here (not just dev): the computer-use bridge
# creates its private 0700 socket dir under OS temp.
tempfile.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
zeron-sync = { workspace = true, features = ["mock-server"] }
